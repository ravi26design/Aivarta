<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>AI VARTA — Account Created</title>
<link rel="stylesheet" href="css/styles.css?v=4">
<style>
  .overlay{background:radial-gradient(120% 120% at 50% 0%, #12202a 0%, #0a0f14 60%, #05070a 100%)}
  .ty{position:relative;width:600px;background:#fff;border-radius:28px;padding:52px 48px 44px;text-align:center;
      box-shadow:0 40px 120px rgba(0,0,0,.45);overflow:hidden}
  /* soft brand glow at the top of the card */
  .ty::before{content:"";position:absolute;top:-140px;left:50%;transform:translateX(-50%);
      width:420px;height:280px;background:radial-gradient(closest-side, rgba(0,255,136,.28), rgba(0,171,255,.18), transparent 72%);
      filter:blur(6px);pointer-events:none}
  .ty > *{position:relative}

  /* success badge with pulsing rings */
  .ty-badge{width:120px;height:120px;margin:0 auto 26px;position:relative;display:grid;place-items:center}
  .ty-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,200,120,.35)}
  .ty-ring.r2{inset:-16px;border-color:rgba(0,171,255,.22)}
  .ty-ring{animation:tyPulse 2.4s ease-out infinite}
  .ty-ring.r2{animation-delay:.6s}
  @keyframes tyPulse{0%{transform:scale(.75);opacity:.9}70%{opacity:0}100%{transform:scale(1.35);opacity:0}}
  .ty-check{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
      box-shadow:0 14px 34px rgba(0,171,255,.45);animation:tyPop .5s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes tyPop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .ty-check svg{width:44px;height:44px;stroke:#fff;stroke-width:3;fill:none;
      stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;
      animation:tyDraw .45s .35s ease forwards}
  @keyframes tyDraw{to{stroke-dashoffset:0}}

  /* confetti dots */
  .ty-confetti span{position:absolute;top:64px;width:9px;height:9px;border-radius:2px;opacity:.9;animation:tyFall 2.6s ease-in infinite}
  .ty-confetti span:nth-child(1){left:14%;background:#00ff88;animation-delay:.1s}
  .ty-confetti span:nth-child(2){left:30%;background:#00abff;border-radius:50%;animation-delay:.5s}
  .ty-confetti span:nth-child(3){left:70%;background:#00ff88;border-radius:50%;animation-delay:.3s}
  .ty-confetti span:nth-child(4){left:86%;background:#00abff;animation-delay:.7s}
  .ty-confetti span:nth-child(5){left:50%;background:#ffd166;border-radius:50%;animation-delay:.9s}
  @keyframes tyFall{0%{transform:translateY(-10px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(150px) rotate(220deg);opacity:0}}

  .ty h2{font-size:32px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px}
  .ty p{font-size:15px;color:var(--ink-50);line-height:1.7;max-width:440px;margin:0 auto}
  .ty .cta-row{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px}
  .ty-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:300px;
      background:var(--grad);color:#fff;border-radius:80px;padding:17px 40px;font-size:16px;font-weight:600;
      box-shadow:0 12px 30px rgba(0,171,255,.35);transition:transform .18s, box-shadow .18s}
  .ty-btn:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(0,171,255,.45)}
  .ty-btn svg{width:18px;height:18px}
  .ty-later{font-size:14px;color:#9aa0a8}
  .ty-later:hover{color:#111}
</style>
</head>
<body>
<div class="overlay">
  <div class="ty">
    <div class="ty-confetti"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="ty-badge">
      <span class="ty-ring"></span><span class="ty-ring r2"></span>
      <span class="ty-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
    </div>
    <h2>Thank you</h2>
    <p>Your AI VARTA account has been successfully created. Please complete your payment to start enjoying the benefits of our smart AI Assistant.</p>
    <div class="cta-row">
      <a class="ty-btn" href="onboard-choose-plan.html">Continue to Payment
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="ty-later" href="home.html">Maybe later</a>
    </div>
  </div>
</div>
<script>try{localStorage.setItem('aivarta_loggedin','1');}catch(e){}</script>
</body>
</html>
