<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>AI VARTA — Company Details</title>
<link rel="stylesheet" href="css/styles.css?v=6">
<style>
  .flag-in{display:flex;flex-direction:column;width:100%;height:100%}
  .flag-in i{flex:1}
  .flag-in .o{background:#ff9933}.flag-in .w{background:#fff}.flag-in .g{background:#138808}
</style>
</head>
<body>
<div class="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Tell more about company</h2>
      <a class="x" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <div class="f">
      <label>Name <span class="req">*</span></label>
      <input placeholder="Enter your name">
    </div>
    <div class="f-row">
      <div class="f" style="width:130px">
        <label>Country</label>
        <div class="cc" style="border:1px solid #e2e4e8;border-radius:12px;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px">
          <span class="flag" style="width:22px;height:15px;border-radius:2px;overflow:hidden"><span class="flag-in"><i class="o"></i><i class="w"></i><i class="g"></i></span></span>
          <span style="font-size:16px">IN</span>
          <svg style="margin-left:auto;width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="f" style="flex:1">
        <label>Mobile number</label>
        <input placeholder="Enter your mobile number">
      </div>
    </div>
    <div class="f">
      <label>GSTIN</label>
      <input placeholder="Enter your email">
    </div>
    <a class="btn-full" href="auth-confirm.html">Save</a>
  </div>
</div>
</body>
</html>
